# clusterctl reads this to map a release of this repository to a Cluster API contract version.
# Without it `clusterctl init` and `clusterctl upgrade` refuse to install the provider, because
# they have no way to know which core Cluster API it was built against.
#
# Both providers in this repository ship from one tag, so one file covers both.
---
apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3
kind: Metadata
releaseSeries:
  - major: 0
    minor: 1
    contract: v1beta2
