# clusterctl reads this to map a release of this repository to a Cluster API contract version.
# Without it `clusterctl init` and `clusterctl upgrade` refuse to install the provider, because
# they have no way to know which core Cluster API it was built against.
#
# Both providers in this repository ship from one tag, so one file covers both.
---
apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3
kind: Metadata
releaseSeries:
  - major: 0 # x-release-please-major
    minor: 9 # x-release-please-minor
    contract: v1beta2
  # Past series, kept so `clusterctl upgrade` (and tools built on it, like Rancher Turtles) can
  # map the installed version while planning an upgrade to the current one. The entry above is
  # the only one release-please moves, so the current series is deliberately listed again below:
  # the duplicate is harmless today and is what keeps this series mapped the moment the entry
  # above is bumped to the next release. Each release cuts a new duplicate here. Each contract
  # below is what that series' own metadata.yaml declared at its tag, not an assumption.
  - major: 0
    minor: 8
    contract: v1beta2
  - major: 0
    minor: 7
    contract: v1beta2
  - major: 0
    minor: 6
    contract: v1beta2
  - major: 0
    minor: 5
    contract: v1beta2
  - major: 0
    minor: 4
    contract: v1beta2
  - major: 0
    minor: 3
    contract: v1beta2
  - major: 0
    minor: 2
    contract: v1beta2
  - major: 0
    minor: 1
    contract: v1beta2
