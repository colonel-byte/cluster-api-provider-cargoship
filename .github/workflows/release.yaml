---
name: goreleaser

on:
  push:
    tags:
      - "*"

# Read only at the top so that a job has to ask for what it writes.
permissions:
  contents: read

jobs:
  goreleaser:
    # - contents: write creates the release and uploads the component manifests
    # - packages: write pushes the two controller images
    # - id-token: write is the OIDC token cosign signs against
    # - attestations: write proves provenance of what was built
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Setup cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Setup golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de #v7.3.0
        with:
          distribution: goreleaser
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}

      # The three files clusterctl fetches by name. Checked rather than assumed, because a
      # release missing one of them fails at `clusterctl init` time with a 404 that names a URL
      # rather than a build step, and the fix is a whole new tag.
      - name: Check clusterctl's artifacts were published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for asset in bootstrap-components.yaml control-plane-components.yaml metadata.yaml; do
            if ! gh release view "${GITHUB_REF_NAME}" --json assets \
                --jq '.assets[].name' | grep -qx "${asset}"; then
              echo "::error::${asset} is missing from the release; clusterctl cannot install this version"
              exit 1
            fi
          done

      - name: Attest artifacts
        id: attest-artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Attest images
        id: attest-images
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/digest.txt

      # The AI-usage disclosure, stamped with this release's version, commit and build time. It is
      # a per-release snapshot of what .github/ai-bom.json claims rather than a list of anything
      # in the release, which is why it is rendered here and not built by goreleaser.
      - name: Render AI-BOM
        run: |
          jq \
            --arg version "${GITHUB_REF_NAME}" \
            --arg commit "${GITHUB_SHA}" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.subject.version = $version | .subject.commit = $commit | .generatedAt = $generatedAt' \
            .github/ai-bom.json > dist/ai-bom.json

      - name: Attest AI-BOM
        id: attest-ai-bom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/ai-bom.json

      - name: Publish provenance with the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.attest-artifacts.outputs.bundle-path }}" provider_artifacts.intoto.jsonl
          cp "${{ steps.attest-images.outputs.bundle-path }}" provider_images.intoto.jsonl
          cp "${{ steps.attest-ai-bom.outputs.bundle-path }}" provider_ai-bom.intoto.jsonl

          gh release upload "${GITHUB_REF_NAME}" \
            provider_artifacts.intoto.jsonl provider_images.intoto.jsonl \
            provider_ai-bom.intoto.jsonl dist/ai-bom.json --clobber
