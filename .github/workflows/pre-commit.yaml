---
name: Validate pre-commit hooks

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs the hooks from .pre-commit-config.yaml, so licensing, formatting
      # and sorting can never drift from the local pre-commit setup. Skipped:
      #   controller-gen, kustomize-build - `repo: local` hooks that shell out to
      #     make and regenerate files; the Verify generated files workflow covers
      #     them with the full toolchain.
      #   golangci-lint - already covered by the Validate Lint workflow.
      - name: Run hooks
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          extra-args: >-
            --all-files
            --skip controller-gen
            --skip kustomize-build
            --skip golangci-lint
