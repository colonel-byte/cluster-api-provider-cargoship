---
name: Check for go mod changes

# Deliberately not at the bottom of a stack with this shape. `go mod vendor` only vendors what
# something imports, so on a branch carrying the dependency tree and no code it deletes the whole
# tree, and on a branch carrying only some of the code it deletes whatever the later layers need.
# It is correct from the branch that holds the last Go package onward, which is this one.

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  validate-go-mod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup golang
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # Pinned on purpose rather than left to float: the k8s.io modules are held at the versions
      # sigs.k8s.io/cluster-api was built against, because a newer patch wants
      # structured-merge-diff/v7 while cluster-api pins v6 and the module then stops compiling.
      # If this fails after a dependency bump, read docs/agent/choice-tool-dependencies.md before
      # raising a pin.
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # vendor/ is committed and every CI job builds with -mod=vendor, so a stale tree means CI
      # tests different code than go.mod declares -- silently, and in the direction of passing.
      # `make vendor`, not `go mod vendor`: the target also writes the three generated
      # osv-scanner.toml files that `go mod vendor` deletes along with the rest of the tree, so a
      # bare `go mod vendor` here would report them as a diff. See docs/agent/choice-osv-vendor-overrides.md.
      - name: Check vendor/ matches go.mod
        run: |
          make vendor
          git diff --exit-code vendor/

      # The diff above catches a deleted or edited override. This catches the other half: a
      # dependency bump that brings in a module carrying a lockfile no override covers, which
      # would otherwise drop the Scorecard score on some later run with nothing in the diff to
      # point at. Both that and a dropped module need an edit to Overrides in
      # magefiles/pkg/gen/osv, which is why they are left to fail here.
      #
      # Renovate re-vendors on every gomod update and trips the step above every time;
      # fix-vendor-osv.yaml pushes the regenerated overrides back onto its branch.
      - name: Check the vendored osv-scanner overrides
        run: make verify-vendor
