# The config for Dependabot's pull request titles, selected by author in
# .github/workflows/commitlint.yaml.
#
# Dependabot cannot shorten a module path, and a `build(deps): bump <module> from X to Y` title
# for a long one goes past 100 characters on its own -- sigs.k8s.io/controller-runtime/tools/
# setup-envtest and k8s.io/apiextensions-apiserver both do. So header-max-length is off here and
# left on everywhere else. Every other rule still applies, so a malformed type or subject fails
# the same way it would on a human's title.
#
# Rules other than header-max-length must match .commitlintrc.yaml. There is no shared base
# because commitlint cannot extend a YAML sibling.
extends:
  - "@commitlint/config-conventional"
rules:
  header-max-length:
    - 0
  subject-case:
    - 0
    - always
    - - "lower-case"
      - "sentence-case"
