# The config for bot-authored pull request titles, selected by author in
# .github/workflows/commitlint.yaml.
#
# A bot cannot shorten a module path. `build(deps): bump <module> from X to Y` runs past 100
# characters for any dependency with a long import path, so header-max-length is off here and
# left on everywhere else. Every other rule still applies, so a malformed type or subject
# fails the same way it would on a human's title.
#
# Rules other than header-max-length must match .commitlintrc.yaml. There is no shared base
# because commitlint cannot extend a YAML sibling.
extends:
  - "@commitlint/config-conventional"
rules:
  header-max-length:
    - 0
  subject-case:
    - 0
    - always
    - - "lower-case"
      - "sentence-case"
