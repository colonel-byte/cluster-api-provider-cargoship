---
name: Documentation issue
description: A page in the book that is wrong, missing, or unclear.
title: "docs: "
labels:
  - documentation
body:
  - type: input
    id: page
    attributes:
      label: Which page
      description: The URL in the book, or the path to the Markdown source.
      placeholder: docs/dev/e2e-tests.md
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong with it
      options:
        - Factually wrong - it describes behaviour the provider does not have
        - Out of date - it described the old behaviour correctly
        - Missing - there is no page for this
        - Unclear - correct, but I could not act on it
        - A command or snippet in it does not work as written
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: What it says and what it should say
      description: Quote the sentence or snippet. If a command fails, paste what you ran and what it printed.
    validations:
      required: true
  - type: checkboxes
    id: generated
    attributes:
      label: Generated pages
      description: "`docs/index.md` is generated from `README.md` and `docs/SUMMARY.md` from the pages on disk, and a CRD field's description comes from the Go doc comment on its type. A fix in any of those belongs in the source, not in the page. Check with `git check-attr linguist-generated -- <path>` when unsure."
      options:
        - label: I checked whether this page is generated
          required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: The page you expected to find it on, or a search term that should have led you there and did not.
