# The air-gapped install path: one Zarf package carrying both controller images and the same
# component manifests clusterctl would download, so a management cluster with no route to
# ghcr.io can still be given this provider.
#
# The components come from out/, which `make release-manifests` writes, rather than from the
# kustomizations directly. Zarf can run kustomize itself, but then the package would deploy
# something assembled a second way, and the thing an operator installs by hand and the thing
# this package installs would be free to drift. `make zarf-package` builds out/ first, at the
# version pinned below, so the manifests cannot name a tag the package's images do not carry.
#
# The one kustomization Zarf does run is manifest/turtle/, which only wraps those same two files
# in the ConfigMaps the Cluster API Operator reads a provider out of -- so it assembles nothing
# a second way, it repackages what out/ already holds. `make zarf-package` stages the files it
# reads, for the same version-pinning reason; a bare `zarf package create` renders whatever a
# previous build left there, or fails on the missing files.
#
# The three pins are not templated, because `###ZARF_PKG_TMPL_...###` does not reach an image
# reference in a v1beta1 package: validation parses the reference before `--set` is applied and
# rejects it. release-please rewrites all three on a release instead -- it is listed in
# release-please-config.json's extra-files for that, and the trailing comments are what it
# looks for.
---
apiVersion: zarf.dev/v1beta1
kind: ZarfPackageConfig
metadata:
  name: cluster-api-provider-cargoship
  description: The cargoship bootstrap and control-plane providers for Cluster API
  version: 0.4.1 # x-release-please-version
  annotations:
    org.opencontainers.image.source: https://github.com/colonel-byte/cluster-api-provider-cargoship
components:
  # Neither of these two is optional. Both providers ship from one tag and are only ever
  # version-matched; a cluster holding one of them reconciles nothing. They are also what makes
  # the package worth deploying at all, and `zarf package deploy --confirm` skips every optional
  # component without a word -- marking these would make the documented deploy install nothing.
  - name: bootstrap-provider
    description: CargoshipConfig and CargoshipConfigTemplate, in cargoship-bootstrap-system
    optional: true
    manifests:
      - name: bootstrap-components
        namespace: cargoship-bootstrap-system
        files:
          - out/bootstrap-components.yaml
    images:
      - name: ghcr.io/colonel-byte/cluster-api-cargoship-bootstrap-controller:0.4.1 # x-release-please-version

  - name: controlplane-provider
    description: CargoshipControlPlane, in cargoship-controlplane-system
    optional: true
    manifests:
      - name: control-plane-components
        namespace: cargoship-controlplane-system
        files:
          - out/control-plane-components.yaml
    images:
      - name: ghcr.io/colonel-byte/cluster-api-cargoship-controlplane-controller:0.4.1 # x-release-please-version

  - name: rancher-turtle-artifacts
    description: Both halves' components as one OCI artifact, which the Cluster API Operator and Rancher Turtles install from
    # Opt-in from the moment it carries manifests: a CAPIProvider applied to a cluster whose
    # Rancher Turtles CRDs are missing fails the component, and so the whole deploy, for everyone
    # installing this with clusterctl instead. Turtles has to be on the cluster first.
    optional: true
    images:
      - name: ghcr.io/colonel-byte/cluster-api-cargoship-bootstrap-controller:0.4.1 # x-release-please-version
      - name: ghcr.io/colonel-byte/cluster-api-cargoship-controlplane-controller:0.4.1 # x-release-please-version
      - name: ghcr.io/colonel-byte/turtle/cargoship:v0.4.1 # x-release-please-version
    # The ConfigMaps a CAPIProvider with a `fetchConfig` selector reads its components out of, and
    # the two CAPIProviders themselves -- so the operator's ConfigMap install path needs no
    # `kubectl create configmap` by hand on the inside. See docs/guides/rancher-turtles.md. No
    # `namespace:` key: each object names its own, and Zarf creates it when it installs the
    # generated Helm release.
    manifests:
      - name: control-plane
        serverSideApply: auto
        kustomize:
          files:
            - manifest/turtle/control-plane
        files:
          - manifest/turtle/capi-provider-control-plane.yaml
      - name: bootstrap
        serverSideApply: auto
        kustomize:
          files:
            - manifest/turtle/bootstrap
        files:
          - manifest/turtle/capi-provider-bootstrap.yaml
