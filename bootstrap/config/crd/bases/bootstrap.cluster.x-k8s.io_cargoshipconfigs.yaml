---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: cargoshipconfigs.bootstrap.cluster.x-k8s.io
spec:
  group: bootstrap.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: CargoshipConfig
    listKind: CargoshipConfigList
    plural: cargoshipconfigs
    shortNames:
    - csc
    singular: cargoshipconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Bootstrap secret created
      jsonPath: .status.initialization.dataSecretCreated
      name: Ready
      type: string
    - description: Time since creation
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CargoshipConfig is the bootstrap configuration for one machine
          in a cargoship-managed cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired state of CargoshipConfig.
            properties:
              files:
                description: |-
                  files are written to the machine before cargoship connects.

                  Keep this empty if you can. It exists for what must be true before SSH works at all -- a
                  proxy configuration, a CA bundle the machine needs to resolve anything, a network script
                  the image does not carry. Everything after the first connection is a cargoship phase, and
                  a file placed here is a file no phase reports on and no receipt records.
                items:
                  description: File is a file written by the bootstrap data.
                  properties:
                    content:
                      description: |-
                        content is the file's contents, written literally.

                        A secret does not belong here: bootstrap data reaches the machine through the
                        infrastructure provider's user-data channel, which on most providers is readable from the
                        instance metadata service by anything running on the host. Use contentFrom.
                      maxLength: 131072
                      type: string
                    contentFrom:
                      description: |-
                        contentFrom reads the contents from a secret key in the CargoshipConfig's namespace.

                        This is no more private than content once the bootstrap secret is rendered -- the value is
                        copied into it either way. What it buys is that the value is not in the CargoshipConfig
                        itself, so it is not in the Git repository the CR is applied from.
                      properties:
                        secret:
                          description: secret is the secret and key to read.
                          properties:
                            key:
                              description: key within the secret.
                              maxLength: 253
                              minLength: 1
                              type: string
                            name:
                              description: name of the secret.
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - secret
                      type: object
                    owner:
                      description: owner is the "user:group" the file is written as.
                      maxLength: 65
                      type: string
                    path:
                      description: path is the absolute path to write to.
                      maxLength: 4096
                      minLength: 1
                      type: string
                    permissions:
                      description: |-
                        permissions is the file mode, as a string, because a leading zero in YAML is how "0600"
                        becomes 384.
                      maxLength: 4
                      type: string
                  required:
                  - path
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-type: atomic
              preCargoshipCommands:
                description: |-
                  preCargoshipCommands run on first boot, before cargoship connects. The same warning as
                  files applies, and more strongly: a command here runs once, unreported, with no retry.
                items:
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: atomic
              sshAuthorizedKeys:
                description: |-
                  sshAuthorizedKeys are public keys appended to the user's authorized_keys.

                  The control plane's own key is added by the controller from its sshSecretRef, so this is
                  for the extra ones: an operator's key for breaking glass, a backup agent's. A config with
                  none is valid and normal.
                items:
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: atomic
              user:
                description: |-
                  user is the login cargoship connects as. The user must already exist in the image; this
                  configures its authorized keys rather than creating it, because an image that does not
                  carry the account is a packaging problem a bootstrap script should not paper over.
                maxLength: 32
                minLength: 1
                type: string
            type: object
          status:
            description: status is the observed state of CargoshipConfig.
            properties:
              conditions:
                description: conditions represent the observations of a CargoshipConfig's
                  current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dataSecretName:
                description: dataSecretName is the name of the secret that stores
                  the bootstrap data.
                maxLength: 253
                minLength: 1
                type: string
              failureMessage:
                description: failureMessage is the human-readable half of failureReason.
                maxLength: 10240
                type: string
              failureReason:
                description: |-
                  failureReason is set when the config can never become ready, as opposed to not being ready
                  yet. The Machine controller treats it as terminal.
                maxLength: 256
                type: string
              initialization:
                description: initialization provides observations of the initialization
                  process.
                properties:
                  dataSecretCreated:
                    description: |-
                      dataSecretCreated is true when the Machine's bootstrap secret is created.

                      This field is part of the Cluster API contract: an infrastructure provider waits on it
                      before creating a machine. The v1beta1 spelling was status.ready.
                    type: boolean
                type: object
              observedGeneration:
                description: observedGeneration is the latest generation observed
                  by the controller.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
