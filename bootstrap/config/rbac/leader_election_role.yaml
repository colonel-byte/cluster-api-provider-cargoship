# Namespaced, not cluster-wide: leader election only ever touches a Lease in the
# controller's own namespace, and a ClusterRole for it would grant configmap and
# lease access everywhere for no reason.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leader-election-role
  namespace: system
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
