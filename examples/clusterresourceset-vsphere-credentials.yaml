# A ClusterResourceSet that delivers the vSphere CPI and CSI credential secrets into a workload
# cluster, for a package whose values opt out of generating them:
#
#   addons:
#     vsphere:
#       auth:
#         secret:
#           generate: false
#           cpiName: vsphere-cpi-creds
#           csiName: vsphere-config-secret
#
# Both objects below live in the management cluster, in the Cluster's own namespace. The core
# Cluster API controllers apply the envelope secret's contents into the workload cluster once its
# control plane answers; until then the CPI and CSI pods crash-loop waiting for the secrets,
# which is expected and self-heals.
#
# Select the cluster by labelling it:
#
#   kubectl label cluster ${CLUSTER_NAME} vsphere-credentials=true
#
# Render with clusterctl the same way as the cluster template:
#
#   clusterctl generate yaml --from ./clusterresourceset-vsphere-credentials.yaml > creds.yaml
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: vsphere-credentials
  namespace: ${NAMESPACE}
spec:
  # Reconcile re-applies the secrets if they are edited or deleted in the workload cluster;
  # ApplyOnce, the default, would deliver them once and never look again.
  strategy: Reconcile
  clusterSelector:
    matchLabels:
      vsphere-credentials: "true"
  resources:
    - kind: Secret
      name: vsphere-credentials-resources
---
# The envelope: a secret of type addons.cluster.x-k8s.io/resource-set, each data key holding
# whole manifests to apply into the workload cluster.
apiVersion: v1
kind: Secret
metadata:
  name: vsphere-credentials-resources
  namespace: ${NAMESPACE}
type: addons.cluster.x-k8s.io/resource-set
stringData:
  vsphere-credentials.yaml: |
    ---
    # What the rancher-vsphere-cpi chart would have generated: one username and password pair
    # per vCenter, keyed by the host exactly as addons.vsphere.host names it.
    apiVersion: v1
    kind: Secret
    metadata:
      name: vsphere-cpi-creds
      namespace: kube-system
    type: Opaque
    stringData:
      ${VSPHERE_SERVER}.username: ${VSPHERE_USERNAME}
      ${VSPHERE_SERVER}.password: ${VSPHERE_PASSWORD}
    ---
    # What the rancher-vsphere-csi chart would have generated: the driver's whole configuration,
    # credentials included. cluster-id must be unique per cluster in the vCenter, and the host,
    # datacenters and insecure-flag must agree with addons.vsphere in the package values.
    apiVersion: v1
    kind: Secret
    metadata:
      name: vsphere-config-secret
      namespace: kube-system
    type: Opaque
    stringData:
      csi-vsphere.conf: |
        [Global]
        cluster-id = "${CLUSTER_NAME}"
        user = "${VSPHERE_USERNAME}"
        password = "${VSPHERE_PASSWORD}"
        port = "443"
        insecure-flag = "1"

        [VirtualCenter "${VSPHERE_SERVER}"]
        datacenters = "${VSPHERE_DATACENTER}"
